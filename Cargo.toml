[package]
name = "ribozym"
version = "0.1.0"
edition = "2021"
description = "Autonomous multi-agent R&D ecosystem: turns a spec into working software"
license = "MIT"

[lib]
name = "ribozym"
path = "src/lib.rs"

[[bin]]
name = "ribozym"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
jsonschema = "0.18"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
debug = 1
